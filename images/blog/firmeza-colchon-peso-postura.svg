<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="La firmeza correcta mantiene la columna alineada">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17284f"/><stop offset="1" stop-color="#0c1730"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="58%">
      <stop offset="0" stop-color="#D4AF37" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="600" cy="300" rx="540" ry="310" fill="url(#glow)"/>
  <rect width="1200" height="630" filter="url(#grain)" opacity="0.05"/>

  <g id="contenido" transform="translate(0,-60)">

  <!-- Tres escenas: blando, correcto, duro -->
  <g stroke-linecap="round" fill="none">
    <!-- Demasiado blando -->
    <rect x="110" y="300" width="300" height="86" rx="10" stroke="#E9C766" stroke-opacity="0.4" stroke-width="2"/>
    <path d="M110 330 C 190 330, 210 372, 260 372 C 310 372, 330 330, 410 330" stroke="#E9C766" stroke-opacity="0.28" stroke-width="1.6"/>
    <path d="M140 322 C 200 322, 214 360, 260 360 C 306 360, 322 322, 380 322" stroke="#D98A8A" stroke-width="4.5"/>
    <circle cx="140" cy="322" r="13" fill="#D98A8A" stroke="none"/>

    <!-- Correcto -->
    <rect x="450" y="300" width="300" height="86" rx="10" stroke="#E9C766" stroke-opacity="0.7" stroke-width="2"/>
    <path d="M450 330 C 520 330, 540 344, 600 344 C 660 344, 680 330, 750 330" stroke="#E9C766" stroke-opacity="0.32" stroke-width="1.6"/>
    <path d="M480 324 C 540 324, 556 331, 600 331 C 644 331, 660 324, 720 324" stroke="#E9C766" stroke-width="5"/>
    <circle cx="480" cy="324" r="13" fill="#E9C766" stroke="none"/>

    <!-- Demasiado duro -->
    <rect x="790" y="300" width="300" height="86" rx="10" stroke="#E9C766" stroke-opacity="0.4" stroke-width="2"/>
    <path d="M790 330h300" stroke="#E9C766" stroke-opacity="0.28" stroke-width="1.6"/>
    <path d="M820 318 C 880 318, 890 306, 930 306 C 970 306, 1000 318, 1060 318" stroke="#D98A8A" stroke-width="4.5"/>
    <circle cx="820" cy="318" r="13" fill="#D98A8A" stroke="none"/>
  </g>

  <!-- Huecos señalados -->
  <g stroke="#D98A8A" stroke-opacity="0.55" stroke-width="1.3" stroke-dasharray="4 5">
    <path d="M930 306v22"/>
  </g>

  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle" font-size="25">
    <text x="260" y="438" fill="#D98A8A">Demasiado blando</text>
    <text x="600" y="438" fill="#F3E7C6">Firmeza correcta</text>
    <text x="940" y="438" fill="#D98A8A">Demasiado firme</text>
  </g>

  </g>
</svg>

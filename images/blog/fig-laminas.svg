<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" aria-label="La separación entre láminas no debe pasar de 7 centímetros">
  <rect width="1000" height="320" fill="#FCFAF4"/>

  <text x="500" y="40" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#14203F" text-anchor="middle">La regla de los 7 centímetros</text>

  <!-- ── BIEN: láminas juntas ── -->
  <g transform="translate(60,0)">
    <text x="190" y="78" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" letter-spacing="0.06em" fill="#2d8a4e" text-anchor="middle">HASTA 7 cm · BIEN</text>

    <!-- colchón apoyado -->
    <path d="M20 118 h340 v46 h-340 z" fill="#fff" stroke="#14203F" stroke-width="1.8"/>
    <path d="M20 164 h340" stroke="#14203F" stroke-opacity="0.2" stroke-width="1"/>
    <text x="190" y="146" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#7B8496" text-anchor="middle">el colchón apoya plano</text>

    <!-- láminas juntas -->
    <g fill="#C9A227" fill-opacity="0.5">
      <rect x="20" y="176" width="26" height="13" rx="5"/>
      <rect x="58" y="176" width="26" height="13" rx="5"/>
      <rect x="96" y="176" width="26" height="13" rx="5"/>
      <rect x="134" y="176" width="26" height="13" rx="5"/>
      <rect x="172" y="176" width="26" height="13" rx="5"/>
      <rect x="210" y="176" width="26" height="13" rx="5"/>
      <rect x="248" y="176" width="26" height="13" rx="5"/>
      <rect x="286" y="176" width="26" height="13" rx="5"/>
      <rect x="324" y="176" width="26" height="13" rx="5"/>
    </g>
    <!-- cota del hueco -->
    <g stroke="#2d8a4e" stroke-width="1.3">
      <path d="M46 206h12M48 202l-4 4 4 4M56 202l4 4-4 4"/>
    </g>
    <text x="190" y="242" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3D4657" text-anchor="middle">La espuma no tiene por dónde colarse</text>
    <text x="190" y="262" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3D4657" text-anchor="middle">y la superficie se mantiene lisa</text>
  </g>

  <line x1="500" y1="60" x2="500" y2="286" stroke="#E2DDD0" stroke-width="1" stroke-dasharray="5 7"/>

  <!-- ── MAL: láminas separadas ── -->
  <g transform="translate(560,0)">
    <text x="190" y="78" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" letter-spacing="0.06em" fill="#C0392B" text-anchor="middle">MÁS DE 7 cm · MAL</text>

    <!-- colchón ondulado -->
    <path d="M20 118 h340 v34 c-20 0 -20 16 -44 16 c-24 0 -24 -16 -46 -16 c-22 0 -22 16 -46 16 c-24 0 -24 -16 -46 -16 c-22 0 -22 16 -46 16 c-24 0 -24 -16 -46 -16 c-22 0 -22 16 -46 16 c-10 0 -14 -8 -20 -12 z"
          fill="#fff" stroke="#14203F" stroke-width="1.8"/>
    <text x="190" y="142" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#C0392B" text-anchor="middle">el colchón se ondula por debajo</text>

    <!-- láminas separadas -->
    <g fill="#C9A227" fill-opacity="0.5">
      <rect x="20" y="184" width="26" height="13" rx="5"/>
      <rect x="112" y="184" width="26" height="13" rx="5"/>
      <rect x="204" y="184" width="26" height="13" rx="5"/>
      <rect x="296" y="184" width="26" height="13" rx="5"/>
    </g>
    <g stroke="#C0392B" stroke-width="1.3">
      <path d="M46 214h66M48 210l-4 4 4 4M110 210l4 4-4 4"/>
    </g>
    <text x="190" y="242" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3D4657" text-anchor="middle">Los somieres antiguos de cuatro o cinco</text>
    <text x="190" y="262" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#3D4657" text-anchor="middle">láminas anchas incumplen esto de largo</text>
  </g>
</svg>
